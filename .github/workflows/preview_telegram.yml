name: Preview Telegram Digest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Read only: use the latest accessible state; do not save or update it.
      # A tracked historical copy may be stale. Never treat checkout as restored cache.
      - name: Remove checkout copy of sent state from runner
        run: rm -f data/sent_news.json
      - name: Restore sent news state if available
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sent_news.json
          key: telegram-preview-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-sent-
      - name: Preview without sending
        run: node scripts/telegram-news.js --preview
