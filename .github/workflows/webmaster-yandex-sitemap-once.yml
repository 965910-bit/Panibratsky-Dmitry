name: Yandex sitemap reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-sitemap-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify production and add missing sitemap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCM_WM_YANDEX_ACCESS_TOKEN: ${{ secrets.SCM_WM_YANDEX_ACCESS_TOKEN }}
        run: python scripts/webmaster_yandex_sitemap_once.py
