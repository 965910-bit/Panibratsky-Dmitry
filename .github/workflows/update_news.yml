name: Update News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-updates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/news.lock

      - name: Google Alerts (if email configured)
        run: |
          python scripts/collect_google_alerts.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        continue-on-error: true

      - name: Fetch news (approved RSS and sitemap sources)
        run: python scripts/fetch_news.py

      # Government RSS and ATI statistics collectors are paused pending review.
      # Historical data are retained; neither collector is invoked here.

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate static news snapshot
        run: python scripts/generate_news_pages.py

      - name: Save daily snapshot
        run: |
          mkdir -p data/news-history
          cp data/news.json data/news-history/$(date +'%Y-%m-%d').json

      - name: Update metadata in trends.html
        run: python scripts/update_metadata.py

      - name: Validate generated files
        run: python -m unittest discover -s tests -v

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/news.json trends.html sitemap.xml rss.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Обновление новостей, sitemap, RSS, метатегов" && git push)
