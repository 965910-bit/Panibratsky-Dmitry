name: Update News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'site-data-updates' || format('news-non-main-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  fetch:
    # Scheduled publication and manual production runs must use the default branch.
    # A dispatch against a feature branch must not collect private mail or push changes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ vars.SCM_PUBLICATION_MODE != 'pr' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/news.lock

      - name: Google Alerts (if email configured)
        run: |
          python scripts/collect_google_alerts.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        continue-on-error: true

      - name: Fetch news (approved RSS and sitemap sources)
        run: python scripts/fetch_news.py

      # Government RSS and ATI statistics collectors are paused pending review.
      # Historical data are retained; neither collector is invoked here.

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Generate RSS feed
        run: python scripts/generate_rss.py

      - name: Generate static news snapshot
        run: python scripts/generate_news_pages.py

      - name: Save daily snapshot
        run: |
          mkdir -p data/news-history
          cp data/news.json data/news-history/$(date +'%Y-%m-%d').json

      - name: Update metadata in trends.html
        run: python scripts/update_metadata.py

      - name: Verify generated news outputs
        run: python scripts/check_news_outputs.py

      - name: Validate generated files
        run: python -m unittest discover -s tests -v

      - name: Commit and push if changed
        id: publish_news
        if: vars.SCM_PUBLICATION_MODE != 'pr'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/news.json trends.html sitemap.xml rss.xml
          if ! git diff --cached --quiet; then
            git commit -m "Обновление новостей, sitemap, RSS, метатегов"
            git push
          fi

      # Opt-in only. App credentials are not used by the legacy path.
      - name: Create scoped publication app token
        id: publication_token
        if: vars.SCM_PUBLICATION_MODE == 'pr'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.SCM_PUBLICATION_APP_ID }}
          private-key: ${{ secrets.SCM_PUBLICATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose verified news through protected PR
        id: publish_news_pr
        if: vars.SCM_PUBLICATION_MODE == 'pr'
        env:
          GH_TOKEN: ${{ steps.publication_token.outputs.token }}
        run: python scripts/publication_pr.py --kind news

      # Keep only the exact validated public outputs when publication fails. The job remains failed.
      - name: Preserve public news outputs after publication failure
        if: ${{ failure() && (steps.publish_news.outcome == 'failure' || steps.publication_token.outcome == 'failure' || steps.publish_news_pr.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: news-publication-failed
          path: |
            data/news.json
            trends.html
            sitemap.xml
            rss.xml
          if-no-files-found: warn
          retention-days: 7
