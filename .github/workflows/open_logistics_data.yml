name: Update open logistics indicators

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      persist_diagnostic:
        description: 'Commit verified public capture to the dispatched non-main branch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'site-data-updates' || format('open-data-diagnostic-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.persist_diagnostic == true) }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test real capture without publication on non-main branches
        if: github.ref != 'refs/heads/main'
        run: |
          cp data/open-logistics.json "$RUNNER_TEMP/open-logistics-before.json"
          python scripts/open_logistics_data.py --archive-dir "$RUNNER_TEMP/open-data-archive" --review-history-dir data/open-logistics-archives
          python scripts/open_data_review.py data/open-logistics.json --previous "$RUNNER_TEMP/open-logistics-before.json" --require-complete --reject-regression
          for archive in "$RUNNER_TEMP"/open-data-archive/*; do
            python scripts/verify_open_archive.py "$archive"
          done
      - name: Keep diagnostic capture for inspection
        if: github.ref != 'refs/heads/main' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-data-diagnostic
          path: |
            ${{ runner.temp }}/open-data-archive/
            data/open-logistics.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified diagnostic capture to dispatched branch
        if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.persist_diagnostic == true
        run: |
          mkdir -p data/open-logistics-archives
          cp -an "$RUNNER_TEMP/open-data-archive/." data/open-logistics-archives/
          for archive in "$RUNNER_TEMP"/open-data-archive/*; do
            python scripts/verify_open_archive.py "data/open-logistics-archives/$(basename "$archive")"
          done
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/open-logistics.json data/open-logistics-archives
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified open data diagnostic"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - name: Preserve previous snapshot for comparison
        if: github.ref == 'refs/heads/main'
        run: cp data/open-logistics.json "$RUNNER_TEMP/open-logistics-before.json"
      - name: Update indicators on main
        if: github.ref == 'refs/heads/main'
        run: python scripts/open_logistics_data.py --archive-dir data/open-logistics-archives --review-history-dir data/open-logistics-archives
      - name: Review saved observations before committing
        if: github.ref == 'refs/heads/main'
        run: python scripts/open_data_review.py data/open-logistics.json --previous "$RUNNER_TEMP/open-logistics-before.json" --require-complete --reject-regression
      - name: Verify archived captures and snapshot before publication
        if: github.ref == 'refs/heads/main'
        run: python scripts/check_open_data_archives.py
      - name: Commit and push only the snapshot
        id: publish_indicators
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/open-logistics.json data/open-logistics-archives
          if ! git diff --cached --quiet; then
            git commit -m "Update open logistics indicators"
            git push
          fi

      # The public, reviewed snapshot is preserved for inspection; it is not published here.
      - name: Preserve public indicators after publication failure
        if: ${{ failure() && steps.publish_indicators.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-data-publication-failed
          path: |
            data/open-logistics.json
            data/open-logistics-archives/
          if-no-files-found: warn
          retention-days: 7
