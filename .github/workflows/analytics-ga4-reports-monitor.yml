name: Weekly Google Analytics report monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '53 11 * * 1'
permissions:
  contents: read
  issues: write
concurrency:
  group: analytics-ga4-reports-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read reports and notify on connection failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCM_GA4_CLIENT_ID: ${{ secrets.SCM_GA4_CLIENT_ID }}
          SCM_GA4_CLIENT_SECRET: ${{ secrets.SCM_GA4_CLIENT_SECRET }}
          SCM_GA4_REFRESH_TOKEN: ${{ secrets.SCM_GA4_REFRESH_TOKEN }}
          SCM_GA4_REPORT_CLIENT_ID: ${{ secrets.SCM_GA4_REPORT_CLIENT_ID }}
          SCM_GA4_REPORT_CLIENT_SECRET: ${{ secrets.SCM_GA4_REPORT_CLIENT_SECRET }}
          SCM_GA4_REPORT_REFRESH_TOKEN: ${{ secrets.SCM_GA4_REPORT_REFRESH_TOKEN }}
        run: python scripts/analytics_ga4_reports_monitor.py
