name: Collect HH Market Analytics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests
          pip install playwright
          playwright install chromium  <-- ВАЖНО: Устанавливаем браузер для работы скрипта
        
      - name: Run HH Python Script
        run: python scripts/hh_analytics.py
        
      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update HH analytics"
          git push
