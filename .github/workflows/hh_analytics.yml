name: Collect HH Market Analytics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-updates
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests
          pip install playwright
          playwright install chromium
        
      - name: Run HH Python Script
        run: python scripts/hh_analytics.py
        
      - name: Commit & Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/hh_warehouse.json data/hh_transport.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update HH analytics"
            git push
          fi
