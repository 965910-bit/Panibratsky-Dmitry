name: Collect HH Market Analytics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'site-data-updates' || format('hh-diagnostic-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/hh.lock
          python -m playwright install chromium
        
      - name: Run HH Python Script
        # Non-main runs are diagnostic only and do not change or publish data.
        env:
          HH_DIAGNOSTIC_ONLY: ${{ github.ref != 'refs/heads/main' && '1' || '0' }}
        run: python scripts/hh_analytics.py
        
      - name: Commit & Push changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/hh_warehouse.json data/hh_transport.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update HH analytics"
            git push
          fi
