name: Telegram review production

on:
  schedule:
    # Hourly 09:00–18:00 Moscow (06:00–15:00 UTC). Queue still accepts at most one draft.
    - cron: '0 6-15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check — read-only queue diagnostic; send — deliver one candidate for review'
        type: choice
        options: [check, send]
        default: check
        required: true
      confirmation:
        description: 'Type PRODUCTION to send at most one candidate to the live reviewer (then ✅ publishes to the channel)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: telegram-review-production-send
  cancel-in-progress: false

jobs:
  production:
    if: ${{ github.event_name == 'schedule' || inputs.confirmation == 'PRODUCTION' }}
    environment: telegram-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install local image renderer
        run: python -m pip install --require-hashes -r telegram-review/requirements-visuals.lock
      - name: Select fresh candidates from explicitly allowed sources
        env:
          SCM_REVIEW_ALLOWED_HOSTS: ${{ vars.SCM_REVIEW_ALLOWED_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/scm-production-review"
          node telegram-review/auto-candidates.mjs "$RUNNER_TEMP/scm-production-review/candidates.json"
          python telegram-review/cards_batch.py "$RUNNER_TEMP/scm-production-review/candidates.json" "$RUNNER_TEMP/scm-production-review/gallery"
      - name: Inspect candidate queue without sending
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
        env:
          REVIEW_INTAKE_URL: https://scm-telegram-review.965910.workers.dev/intake
          REVIEW_INTAKE_SECRET: ${{ secrets.SCM_INTAKE_SECRET }}
        run: node telegram-review/queue-producer.mjs "$RUNNER_TEMP/scm-production-review/gallery" --check-candidate
      - name: Send at most one candidate to live review
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'send' }}
        env:
          REVIEW_INTAKE_URL: https://scm-telegram-review.965910.workers.dev/intake
          REVIEW_INTAKE_SECRET: ${{ secrets.SCM_INTAKE_SECRET }}
        run: node telegram-review/queue-producer.mjs "$RUNNER_TEMP/scm-production-review/gallery" --send-candidate
