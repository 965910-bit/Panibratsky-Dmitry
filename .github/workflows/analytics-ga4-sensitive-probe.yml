name: GA4 isolated sensitive-page privacy probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check live tool page tag without sending analytics
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/analytics_ga4_sensitive_probe.cjs
      - name: Check synthetic search and outbound query markers with collection blocked
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/analytics_ga4_automatic_privacy_probe.cjs
