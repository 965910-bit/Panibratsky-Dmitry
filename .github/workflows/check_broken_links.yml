name: Check Broken Links

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/links.lock

      - name: Check links
        run: python scripts/check_broken_links.py

      - name: Regenerate feed and snapshot when links changed
        run: |
          if ! git diff --quiet -- data/news.json; then
            python scripts/generate_rss.py
            python scripts/generate_news_pages.py
          fi

      - name: Validate site
        run: python -m unittest discover -s tests -v

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/news.json rss.xml trends.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mark broken links" && git push)
