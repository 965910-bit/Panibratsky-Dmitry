name: Send Telegram Digest

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm install

      # The runner is ephemeral. Restore the newest successfully saved digest state.
      # Cache eviction can still cause duplicates; durable storage is preferable.
      - name: Restore sent news state
        uses: actions/cache/restore@v4
        with:
          path: data/sent_news.json
          key: telegram-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-sent-

      - name: Send new news to Telegram
        run: node scripts/telegram-news.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save sent news state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sent_news.json
          key: telegram-sent-${{ github.run_id }}-${{ github.run_attempt }}
