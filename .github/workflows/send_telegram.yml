name: Send Telegram Digest

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'send — отправка; initialize — исключить всю текущую ленту из отправки и создать журнал'
        type: choice
        options:
          - send
          - initialize
        default: send
        required: true

permissions:
  contents: read

concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      # The runner is ephemeral. Restore the newest successfully saved digest state.
      # Missing state stops normal sending; cache is not durable storage.
      # A tracked historical copy may be stale. Never treat checkout as restored cache.
      - name: Remove checkout copy of sent state from runner
        run: rm -f data/sent_news.json
      - name: Restore sent news state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sent_news.json
          key: telegram-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-sent-

      - name: Initialize journal without sending
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'initialize'
        run: node scripts/telegram-news.js --initialize-journal

      - name: Send new news to Telegram
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'send'
        run: node scripts/telegram-news.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save sent news state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/sent_news.json
          key: telegram-sent-${{ github.run_id }}-${{ github.run_attempt }}
