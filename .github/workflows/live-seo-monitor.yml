name: Weekly public SEO smoke check

on:
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-public-seo
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Inspect published sitemap, robots and canonical pages
        run: |
          set -o pipefail
          python scripts/live_seo_check.py | tee "$RUNNER_TEMP/live-seo-report.json"
      - name: Summarise the check
        if: always()
        run: python scripts/live_seo_summary.py "$RUNNER_TEMP/live-seo-report.json" >> "$GITHUB_STEP_SUMMARY"
