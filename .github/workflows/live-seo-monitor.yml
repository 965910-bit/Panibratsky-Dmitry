name: Weekly public SEO smoke check

on:
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-public-seo
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect published sitemap, robots and canonical pages
        run: python scripts/live_seo_check.py
