name: Weekly public SEO smoke check

on:
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-public-seo
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Inspect published sitemap, robots and canonical pages
        run: python scripts/live_seo_check.py
