name: Weekly mobile PageSpeed check
on:
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * 2'
permissions:
  contents: read
concurrency:
  group: pagespeed-monitor
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install and audit isolated Lighthouse fallback
        run: npm ci --prefix tools/pagespeed --ignore-scripts && npm audit --prefix tools/pagespeed --audit-level=high
      - name: Check public homepage mobile speed
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python scripts/pagespeed_monitor.py
