name: Private promotion snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: read
  issues: write
concurrency:
  group: analytics-private-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==44.0.3' 'openpyxl==3.1.5' 'et-xmlfile==2.0.0'
      - name: Test private report generation
        run: python -m unittest discover -s tests -p 'test_analytics_private*.py'
      - name: Create encrypted aggregate snapshot and Excel workbook
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCM_GA4_CLIENT_ID: ${{ secrets.SCM_GA4_CLIENT_ID }}
          SCM_GA4_CLIENT_SECRET: ${{ secrets.SCM_GA4_CLIENT_SECRET }}
          SCM_GA4_REFRESH_TOKEN: ${{ secrets.SCM_GA4_REFRESH_TOKEN }}
          SCM_GA4_REPORT_CLIENT_ID: ${{ secrets.SCM_GA4_REPORT_CLIENT_ID }}
          SCM_GA4_REPORT_CLIENT_SECRET: ${{ secrets.SCM_GA4_REPORT_CLIENT_SECRET }}
          SCM_GA4_REPORT_REFRESH_TOKEN: ${{ secrets.SCM_GA4_REPORT_REFRESH_TOKEN }}
          SCM_WM_GOOGLE_CLIENT_ID: ${{ secrets.SCM_WM_GOOGLE_CLIENT_ID }}
          SCM_WM_GOOGLE_CLIENT_SECRET: ${{ secrets.SCM_WM_GOOGLE_CLIENT_SECRET }}
          SCM_WM_GOOGLE_REFRESH_TOKEN: ${{ secrets.SCM_WM_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/analytics_private_snapshot.py
      - name: Alert on failed report generation or publication
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_JOB_STATUS: ${{ job.status }}
        run: python scripts/analytics_private_snapshot_alert.py
