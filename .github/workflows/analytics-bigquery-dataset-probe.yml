name: BigQuery export dataset metadata probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read GA4 export dataset metadata without querying
        env:
          SCM_GA4_CLIENT_ID: ${{ secrets.SCM_GA4_CLIENT_ID }}
          SCM_GA4_CLIENT_SECRET: ${{ secrets.SCM_GA4_CLIENT_SECRET }}
          SCM_GA4_REFRESH_TOKEN: ${{ secrets.SCM_GA4_REFRESH_TOKEN }}
          SCM_BQ_READ_CLIENT_ID: ${{ secrets.SCM_BQ_READ_CLIENT_ID }}
          SCM_BQ_READ_CLIENT_SECRET: ${{ secrets.SCM_BQ_READ_CLIENT_SECRET }}
          SCM_BQ_READ_REFRESH_TOKEN: ${{ secrets.SCM_BQ_READ_REFRESH_TOKEN }}
        run: python scripts/analytics_bigquery_dataset_probe.py
