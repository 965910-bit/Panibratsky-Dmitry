name: Site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check js/portfolio-menu.js && node --check js/subscribe.js && node --check sw.js && node --check scripts/telegram-news.js
      - run: node tests/calculators.test.js
      - run: node --test tests/assistant.test.js
