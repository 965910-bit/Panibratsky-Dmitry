name: Site checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_publication_app:
        description: 'Read-only GitHub App installation diagnostic'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Homepage browser regression
        run: |
          set +e
          CHROME_PATH="$(command -v google-chrome)" npm run test:browser 2>&1 | tee "$RUNNER_TEMP/browser-test.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            # Keep the failed test name and diagnostic excerpt visible in check annotations.
            python - <<'PYLOG'
          import os
          import re
          from pathlib import Path

          text = Path(os.environ['RUNNER_TEMP'], 'browser-test.log').read_text(errors='replace')
          failures = re.findall(r'(?m)^not ok .*?(?=^# Subtest:|^1\.\.|\Z)', text, re.S)
          excerpt = '\n'.join(failures) if failures else text[-4000:]
          excerpt = excerpt[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Browser regression failed::{excerpt}')
          PYLOG
            exit "$result"
          fi
      - run: cmp node_modules/chart.js/dist/chart.umd.js js/vendor/chart.umd-4.6.1.js && cmp node_modules/chart.js/LICENSE.md js/vendor/chartjs-LICENSE.md
      - run: cmp node_modules/leaflet/dist/leaflet.js js/vendor/leaflet-1.9.4/leaflet.js && cmp node_modules/leaflet/dist/leaflet.js.map js/vendor/leaflet-1.9.4/leaflet.js.map && cmp node_modules/leaflet/dist/leaflet.css js/vendor/leaflet-1.9.4/leaflet.css && cmp node_modules/leaflet/LICENSE js/vendor/leaflet-1.9.4/LICENSE && diff -rq node_modules/leaflet/dist/images js/vendor/leaflet-1.9.4/images
      - run: python -m pip install --require-hashes -r telegram-review/requirements-visuals.lock -r requirements/news.lock
      - run: python -c "import bs4, soupsieve; assert soupsieve.__version__ == '4.1.1'" && python -m unittest discover -s tests -p 'test_news_real_dependencies.py' -v
      - run: python scripts/generate_sitemap.py --check
      - name: Verify generated news outputs
        run: python scripts/check_news_outputs.py
      - run: python scripts/seo_guard.py
      - run: python scripts/check_sitemap_anchors.py
      - run: python scripts/open_data_review.py data/open-logistics.json --require-complete > /dev/null
      - name: Verify archived public data and snapshot
        run: python scripts/check_open_data_archives.py
      - run: python scripts/sync_home_styles.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --check js/contact-goals.js && node --check js/executive.js && node --check js/executive-theme.js && node --check js/executive-pages.js && node --check js/portfolio-menu.js && node --check js/subscribe.js && node --check sw.js && node --check scripts/telegram-news.js
      - run: node tests/calculators.test.js
      - run: npm run test:node
  indexnow-read-only:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check deployed IndexNow prerequisites without submitting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/indexnow_diagnostic.py
      - name: Inspect fixed production HTTP responses without changes
        if: always()
        run: python scripts/live_http_diagnostic.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Check published homepage in Chromium without analytics
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/live_home_browser.cjs

  publication-app-read-only:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.test_publication_app == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate read-only token for this repository
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.SCM_PUBLICATION_APP_ID }}
          private-key: ${{ secrets.SCM_PUBLICATION_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - name: Verify token accesses only the intended repository
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          gh api installation/repositories --jq '.repositories[].full_name' > "$RUNNER_TEMP/app-repositories.txt"
          test "$(wc -l < "$RUNNER_TEMP/app-repositories.txt")" -eq 1
          grep -Fx "$GITHUB_REPOSITORY" "$RUNNER_TEMP/app-repositories.txt" > /dev/null
          echo "Scoped app token can read the expected repository; no writes performed."
  publication-app-policy-read-only:
    # The token has the permissions needed by the future publisher, but this job only reads GitHub APIs.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.test_publication_app == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Generate publication-scope token for API diagnostic
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.SCM_PUBLICATION_APP_ID }}
          private-key: ${{ secrets.SCM_PUBLICATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check ruleset API visibility without writes
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/rulesets/28158455" > "$RUNNER_TEMP/publication-ruleset.json"; then
            echo '::error title=Ruleset details inaccessible::The app token could not read the ruleset details.'
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/publication-effective-rules.json"; then
            echo '::error title=Effective branch rules inaccessible::The app token could not read active branch rules.'
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          ruleset = json.loads((root / 'publication-ruleset.json').read_text())
          rules = json.loads((root / 'publication-effective-rules.json').read_text())
          bypass = ruleset.get('current_user_can_bypass', '<missing>')
          print(f'::notice title=App ruleset visibility::current_user_can_bypass={bypass}; bypass_list_visible={"bypass_actors" in ruleset}')
          if not isinstance(rules, list):
              raise SystemExit('Effective rules are not a list')
          PY
          node_id="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "publication-ruleset.json")))["node_id"])')"
          query='query($id: ID!) { node(id: $id) { ... on RepositoryRuleset { bypassActors { totalCount } } } }'
          if ! gh api graphql -f query="$query" -f id="$node_id" > "$RUNNER_TEMP/publication-bypass-count.json"; then
            echo '::error title=Bypass count inaccessible::GraphQL did not return the ruleset bypass count.'
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'publication-bypass-count.json').read_text())
          try:
              count = result['data']['node']['bypassActors']['totalCount']
          except (KeyError, TypeError):
              print('::error title=Bypass count unavailable::GraphQL did not expose a count.')
              raise SystemExit(1)
          print(f'::notice title=App GraphQL visibility::bypass_actor_count={count}')
          PY
