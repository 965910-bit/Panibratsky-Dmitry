name: Site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check js/executive.js && node --check js/executive-theme.js && node --check js/executive-pages.js && node --check js/portfolio-menu.js && node --check js/subscribe.js && node --check sw.js && node --check scripts/telegram-news.js
      - run: node tests/calculators.test.js
      - run: node --test tests/telegram-review-drafts.test.mjs tests/telegram-review.test.mjs tests/telegram-draft-preview.test.js tests/assistant.test.js tests/p0.test.js tests/prompts.test.js tests/executive-pages.test.js tests/planner-security.test.js tests/telegram.test.js tests/scm-security.test.js tests/market.test.js tests/offline.test.js tests/chat-ui.test.js
