name: Site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Homepage browser regression
        run: CHROME_PATH="$(command -v google-chrome)" npm run test:browser
      - run: cmp node_modules/chart.js/dist/chart.umd.js js/vendor/chart.umd-4.5.1.js && cmp node_modules/chart.js/LICENSE.md js/vendor/chartjs-LICENSE.md
      - run: cmp node_modules/leaflet/dist/leaflet.js js/vendor/leaflet-1.9.4/leaflet.js && cmp node_modules/leaflet/dist/leaflet.js.map js/vendor/leaflet-1.9.4/leaflet.js.map && cmp node_modules/leaflet/dist/leaflet.css js/vendor/leaflet-1.9.4/leaflet.css && cmp node_modules/leaflet/LICENSE js/vendor/leaflet-1.9.4/LICENSE && diff -rq node_modules/leaflet/dist/images js/vendor/leaflet-1.9.4/images
      - run: python -m pip install --require-hashes -r telegram-review/requirements-visuals.lock
      - run: python scripts/generate_sitemap.py --check
      - run: python scripts/seo_guard.py
      - run: python scripts/open_data_review.py data/open-logistics.json --require-complete > /dev/null
      - run: python scripts/sync_home_styles.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --check js/contact-goals.js && node --check js/executive.js && node --check js/executive-theme.js && node --check js/executive-pages.js && node --check js/portfolio-menu.js && node --check js/subscribe.js && node --check sw.js && node --check scripts/telegram-news.js
      - run: node tests/calculators.test.js
      - run: node --test tests/p1-safety.test.js tests/analytics-readiness.test.js tests/p0-followup.test.js tests/operations-estimates.test.js tests/site-batch-audit.test.js tests/inventory-metrics.test.js tests/inventory-models.test.js tests/payroll-safety.test.js tests/dimensional-weight.test.js tests/audit-data-safety.test.js tests/audit-safety.test.js tests/forecast-error.test.js tests/scm-kpi-safety.test.js tests/otif.test.js tests/chart-local.test.js tests/open-logistics.test.js tests/telegram-review-schedule.test.mjs tests/telegram-review-prepare-reviewed.test.mjs tests/telegram-review-staging-smoke.test.mjs tests/telegram-review-queue-producer.test.mjs tests/telegram-review-gallery-submit.test.mjs tests/telegram-review-candidates.test.mjs tests/telegram-review-build-config.test.mjs tests/telegram-review-sqlite.test.mjs tests/telegram-review-drafts.test.mjs tests/telegram-review.test.mjs tests/telegram-draft-preview.test.js tests/assistant.test.js tests/p0.test.js tests/prompts.test.js tests/executive-pages.test.js tests/planner-security.test.js tests/telegram.test.js tests/scm-security.test.js tests/market.test.js tests/offline.test.js tests/chat-ui.test.js
  indexnow-read-only:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployed IndexNow prerequisites without submitting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/indexnow_diagnostic.py
