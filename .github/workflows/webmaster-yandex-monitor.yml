name: Daily Yandex Webmaster read-only monitoring

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-yandex-webmaster-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check connection, sitemap and quota without Yandex writes
        id: access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCM_WM_YANDEX_ACCESS_TOKEN: ${{ secrets.SCM_WM_YANDEX_ACCESS_TOKEN }}
        run: python scripts/webmaster_yandex_monitor.py
      - name: Read robot-discovered sitemap information
        id: sitemap
        env:
          SCM_WM_YANDEX_ACCESS_TOKEN: ${{ secrets.SCM_WM_YANDEX_ACCESS_TOKEN }}
        run: python scripts/webmaster_yandex_discovered.py
      - name: Read Yandex site diagnostic statuses
        id: diagnostics
        env:
          SCM_WM_YANDEX_ACCESS_TOKEN: ${{ secrets.SCM_WM_YANDEX_ACCESS_TOKEN }}
        run: python scripts/webmaster_yandex_site_problems.py
      - name: Track confirmed Yandex sitemap and description problems
        id: issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCM_WM_YANDEX_ACCESS_TOKEN: ${{ secrets.SCM_WM_YANDEX_ACCESS_TOKEN }}
        run: python scripts/webmaster_yandex_issue_health.py
      - name: Alert if any monitoring stage failed
        if: ${{ always() && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
          SITEMAP_OUTCOME: ${{ steps.sitemap.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          ISSUES_OUTCOME: ${{ steps.issues.outcome }}
        run: python scripts/webmaster_yandex_pipeline_alert.py
