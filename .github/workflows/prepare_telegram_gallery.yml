name: Prepare Telegram gallery (no sending)

on:
  schedule:
    # Daily, UTC; Actions can delay or skip scheduled runs.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-gallery-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local image renderer
        run: python -m pip install --require-hashes -r telegram-review/requirements-visuals.lock
      - name: Create unapproved gallery without Telegram
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/scm-editorial"
          node telegram-review/candidates.mjs "$RUNNER_TEMP/scm-editorial/candidates.json"
          python telegram-review/cards_batch.py "$RUNNER_TEMP/scm-editorial/candidates.json" "$RUNNER_TEMP/scm-editorial/gallery"
      - name: Keep review gallery temporarily
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-telegram-gallery
          path: ${{ runner.temp }}/scm-editorial/gallery/
          if-no-files-found: error
          retention-days: 3
