name: Daily Google Search Console monitoring
on:
  schedule:
    - cron: '29 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: daily-google-webmaster-monitor
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check Google access and sitemap without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCM_WM_GOOGLE_CLIENT_ID: ${{ secrets.SCM_WM_GOOGLE_CLIENT_ID }}
          SCM_WM_GOOGLE_CLIENT_SECRET: ${{ secrets.SCM_WM_GOOGLE_CLIENT_SECRET }}
          SCM_WM_GOOGLE_REFRESH_TOKEN: ${{ secrets.SCM_WM_GOOGLE_REFRESH_TOKEN }}
        run: python scripts/webmaster_google_monitor.py
