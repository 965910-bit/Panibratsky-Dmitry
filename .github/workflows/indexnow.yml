name: IndexNow after Pages deployment

on:
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Full earlier main commit SHA; changed sitemap pages since it will be submitted'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-pages
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify deployed pages and notify IndexNow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/indexnow_submit.py
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify current Pages and submit changed pages since baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INDEXNOW_BASE_SHA: ${{ inputs.baseline_sha }}
        run: python scripts/indexnow_submit.py
