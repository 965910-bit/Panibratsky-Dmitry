# Internal audit artifacts are available in the public repository, but not on Pages.
# Preserve Jekyll's standard build exclusions when specifying our own.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - audit
  - "SEO-GEO-АУДИТ-2026-11-16.md"
